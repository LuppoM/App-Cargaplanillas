<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Planillas - Producción</title>
    <link rel="stylesheet" href="/static/planillasvista.css?v=1.4">
</head>
<body>

    <div class="header-container">
        <h2>Carga de Planillas Diarias</h2>
    </div>

    <!-- Toolstrip Principal -->
    <div class="toolstrip">
        <div class="toolstrip-group">
            <button class="btn-tool" onclick="abrirFormulario()">+ Nueva Planilla</button>
            <button class="btn-tool btn-tool-edit" onclick="modificarSeleccionada()">Modificar Planilla</button>
            <button class="btn-tool btn-tool-back" onclick="window.location.href='/'">Volver</button>
        </div>
        <div class="toolstrip-group">
            <span class="filtros-label">Filtros:</span>
            <input type="text" id="input-buscar" placeholder="Buscar por código, sector..." onkeyup="aplicarFiltros()">
            <input type="date" id="filtro-fecha" onchange="aplicarFiltros()">
        </div>
    </div>

    <!-- Solapas por Planta -->
    <div class="tabs-container">
        <button class="tab-button active" onclick="cambiarSolapa('chocolate')">Planta Chocolate</button>
        <button class="tab-button" onclick="cambiarSolapa('golosinas')">Planta Golosinas</button>
    </div>

    <!-- Tabla General Consolidada -->
    <div class="tabla-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Planta</th>
                    <th>Sector</th>
                    <th>Código</th>
                    <th>Turno</th>
                    <th>Hs Trab.</th>
                    <th>Kg Reales</th>
                    <th>Kg Teórico</th>
                    <th>Efic Real %</th>
                    <th>Decomiso %</th>
                    <th>Reproceso %</th>
                    <th>Scrap %</th>
                    <th>Incidencia %</th>
                    <th>Dot. Real</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-planillas">
                <!-- Carga dinámica desde la API -->
            </tbody>
        </table>
    </div>

    <!-- Modal de Carga y Modificación en Pantalla Única -->

    <div id="modal-planilla" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-titulo">Cargar Planilla de Producción</h3>

            <form id="form-planilla" onsubmit="guardarPlanilla(event)">
                <input type="hidden" id="planilla-id">

                <div class="modal-body-scroll">
                    <!-- SECCIÓN 1: GENERAL -->
                    <div class="seccion-titulo">1. Contexto y Tiempos</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Fecha</label>
                            <input type="date" id="fecha" required>
                        </div>
                        <div class="form-group">
                            <label>Turno</label>
                            <select id="turno" required>
                                <option value="Mañana">Mañana</option>
                                <option value="Tarde">Tarde</option>
                                <option value="Noche">Noche</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Centro de Trabajo (Sector)</label>
                            <select id="centro_trabajo" required>
                                <option value="">Seleccione sector...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Código Producto</label>
                            <input type="text" id="codigo" placeholder="Ej: 10204" required oninput="buscarDescripcionYTeoricoAuto()">
                        </div>
                        <div class="form-group col-span-2">
                            <label>Descripción Producto (Auto)</label>
                            <input type="text" id="descripcion_producto" readonly placeholder="Sin coincidencia" class="input-auto-desc">
                        </div>
                        <div class="form-group">
                            <label>Horas Trabajadas</label>
                            <input type="number" step="0.01" id="horas_trabajadas" required>
                        </div>
                        <div class="form-group">
                            <label>Dotación Teórica (Auto)</label>
                            <input type="number" step="0.01" id="dotacion_teorica" readonly class="input-auto">
                        </div>
                        <div class="form-group">
                            <label>Dotación Real (Opcional)</label>
                            <input type="number" step="0.01" id="dotacion_real" placeholder="Toma teórica si omite">
                        </div>
                    </div>

                                        <!-- 2. PRODUCCIÓN Y MERMAS -->
                        <div class="seccion-titulo">2. Producción y Mermas</div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Kg / Cajas Reales</label>
                                <input type="number" step="0.01" id="kg_cajas_reales" required oninput="calcularKPIsEnTiempoReal()">
                            </div>
                            <div class="form-group">
                                <label>Peso Promedio Unid (kg)</label>
                                <input type="number" step="0.0001" id="peso_promedio_unid_kg" value="0">
                            </div>
                            <div class="form-group">
                                <label>Decomiso (kg)</label>
                                <input type="number" step="0.01" id="decomiso_kg" value="0" oninput="calcularKPIsEnTiempoReal()">
                            </div>
                            <div class="form-group">
                                <label>Reproceso (kg)</label>
                                <input type="number" step="0.01" id="reproceso_kg" value="0" oninput="calcularKPIsEnTiempoReal()">
                            </div>
                            <div class="form-group">
                                <label>Scrap Flex (kg)</label>
                                <input type="number" step="0.01" id="scrap_flex_kg" value="0" oninput="calcularKPIsEnTiempoReal()">
                            </div>
                        </div>

                        <!-- Indicadores calculados para el supervisor -->
                        <div class="form-grid" style="background-color: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;">
                            <div class="form-group">
                                <label style="color: #0056b3; font-weight: bold;">Eficiencia Real %</label>
                                <input type="text" id="kpi_efic_real" readonly class="input-auto" value="0.0%" style="font-weight: bold; color: #166534;">
                            </div>
                            <div class="form-group">
                                <label style="color: #0056b3; font-weight: bold;">Decomiso %</label>
                                <input type="text" id="kpi_decomiso_pct" readonly class="input-auto" value="0.00%">
                            </div>
                            <div class="form-group">
                                <label style="color: #0056b3; font-weight: bold;">Reproceso %</label>
                                <input type="text" id="kpi_reproceso_pct" readonly class="input-auto" value="0.00%">
                            </div>
                            <div class="form-group">
                                <label style="color: #0056b3; font-weight: bold;">Scrap Flex %</label>
                                <input type="text" id="kpi_scrap_pct" readonly class="input-auto" value="0.00%">
                            </div>
                        </div>

                                                <!-- 3. DETENCIONES (MINUTOS Y DETALLE) -->
                            <div class="seccion-titulo">3. Detenciones (Minutos y Observaciones)</div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Producción (min)</label>
                                    <input type="number" step="1" id="detencion_produccion" value="0">
                                    <input type="text" id="obs_detencion_produccion" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Refrigerio (min)</label>
                                    <input type="number" step="1" id="detencion_refrigerio" value="0">
                                    <input type="text" id="obs_detencion_refrigerio" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Mecánico (min)</label>
                                    <input type="number" step="1" id="detencion_mecanico" value="0">
                                    <input type="text" id="obs_detencion_mecanico" placeholder="Observación causa..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Eléctrico (min)</label>
                                    <input type="number" step="1" id="detencion_electrico" value="0">
                                    <input type="text" id="obs_detencion_electrico" placeholder="Observación causa..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Calidad (min)</label>
                                    <input type="number" step="1" id="detencion_calidad" value="0">
                                    <input type="text" id="obs_detencion_calidad" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Programación (min)</label>
                                    <input type="number" step="1" id="detencion_programacion" value="0">
                                    <input type="text" id="obs_detencion_programacion" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Limpieza (min)</label>
                                    <input type="number" step="1" id="detencion_limpieza" value="0">
                                    <input type="text" id="obs_detencion_limpieza" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Abastecimiento (min)</label>
                                    <input type="number" step="1" id="detencion_abastecimiento" value="0">
                                    <input type="text" id="obs_detencion_abastecimiento" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Desarrollo (min)</label>
                                    <input type="number" step="1" id="detencion_desarrollo" value="0">
                                    <input type="text" id="obs_detencion_desarrollo" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Alistamiento (min)</label>
                                    <input type="number" step="1" id="detencion_alistamiento" value="0">
                                    <input type="text" id="obs_detencion_alistamiento" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>RRHH (min)</label>
                                    <input type="number" step="1" id="detencion_rrhh" value="0">
                                    <input type="text" id="obs_detencion_rrhh" placeholder="Observación..." class="input-obs">
                                </div>
                                <div class="form-group">
                                    <label>Suministro (min)</label>
                                    <input type="number" step="1" id="detencion_suministro" value="0">
                                    <input type="text" id="obs_detencion_suministro" placeholder="Observación..." class="input-obs">
                                </div>
                            </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarFormulario()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

<script>
    let plantaActual = 'chocolate';
    let datosGlobales = [];
    let listaSectoresGlobal = [];
    let listaTeoricosGlobal = [];
    let idSeleccionado = null;

    document.addEventListener('DOMContentLoaded', async () => {
        await cargarBaseDatosAuxiliares();
        cargarPlanillas();
    });

    function cambiarSolapa(planta) {
        plantaActual = planta;
        idSeleccionado = null;
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        renderizarTabla();
    }

    async function cargarBaseDatosAuxiliares() {
        try {
            const [resSec, resTeor] = await Promise.all([
                fetch('/api/sectores'),
                fetch('/api/teoricos')
            ]);
            const jsonSec = await resSec.json();
            const jsonTeor = await resTeor.json();

            listaSectoresGlobal = jsonSec.datos || [];
            listaTeoricosGlobal = jsonTeor.datos || [];
        } catch (e) {
            console.error("Error al cargar auxiliares:", e);
        }
    }

    function poblarComboSectores() {
        const selectSec = document.getElementById('centro_trabajo');
        if (!selectSec) return;
        
        selectSec.innerHTML = '<option value="">Seleccione sector...</option>';

        const sectoresFiltrados = listaSectoresGlobal.filter(s => 
            String(s.planta).toLowerCase().trim() === plantaActual && (s.activo === undefined || s.activo === true)
        );

        sectoresFiltrados.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.nombre;
            opt.textContent = s.nombre;
            selectSec.appendChild(opt);
        });
    }

    async function cargarPlanillas() {
        try {
            const res = await fetch('/api/planillas');
            const resJson = await res.json();
            datosGlobales = resJson.datos || [];
            renderizarTabla();
        } catch (e) {
            console.error("Error al cargar planillas:", e);
        }
    }

    function calcularKPIs(item) {
        const hsTrab = parseFloat(item.horas_trabajadas) || 0;
        const kgReales = parseFloat(item.kg_cajas_reales) || 0;
        const decomisoKg = parseFloat(item.decomiso_kg) || 0;
        const reprocesoKg = parseFloat(item.reproceso_kg) || 0;
        const scrapKg = parseFloat(item.scrap_flex_kg) || 0;

        const teorico = listaTeoricosGlobal.find(t => String(t.codigo).trim() === String(item.codigo).trim());
        
        let kgTeorico = 0;
        if (teorico) {
            const peso = parseFloat(teorico.peso) || 0;
            const uxb = parseFloat(teorico.uxb) || 0;
            const bultosHora = parseFloat(teorico.bultos_hora) || 0;
            kgTeorico = uxb * peso * bultosHora * hsTrab;
        }

        const eficRealPct = kgTeorico > 0 ? ((kgReales / kgTeorico) * 100) : 0;
        const reprocesoPct = kgReales > 0 ? ((reprocesoKg / kgReales) * 100) : 0;
        const decomisoPct = kgReales > 0 ? ((decomisoKg / kgReales) * 100) : 0;
        const scrapPct = kgReales > 0 ? ((scrapKg / kgReales) * 100) : 0;

        const ttDetencionesMin = (parseFloat(item.detencion_produccion) || 0) +
                                 (parseFloat(item.detencion_refrigerio) || 0) +
                                 (parseFloat(item.detencion_mecanico) || 0) +
                                 (parseFloat(item.detencion_electrico) || 0) +
                                 (parseFloat(item.detencion_calidad) || 0) +
                                 (parseFloat(item.detencion_programacion) || 0) +
                                 (parseFloat(item.detencion_limpieza) || 0) +
                                 (parseFloat(item.detencion_abastecimiento) || 0) +
                                 (parseFloat(item.detencion_desarrollo) || 0) +
                                 (parseFloat(item.detencion_alistamiento) || 0) +
                                 (parseFloat(item.detencion_rrhh) || 0) +
                                 (parseFloat(item.detencion_suministro) || 0);

        const hsDetencion = ttDetencionesMin / 60;
        const incidenciaPct = hsTrab > 0 ? ((hsDetencion / hsTrab) * 100) : 0;

        return {
            kgTeorico: kgTeorico.toFixed(2),
            eficRealPct: eficRealPct.toFixed(1),
            reprocesoPct: reprocesoPct.toFixed(2),
            decomisoPct: decomisoPct.toFixed(2),
            scrapPct: scrapPct.toFixed(2),
            incidenciaPct: incidenciaPct.toFixed(1)
        };
    }

    function calcularKPIsEnTiempoReal() {
        const hsTrab = parseFloat(document.getElementById('horas_trabajadas').value) || 0;
        const kgReales = parseFloat(document.getElementById('kg_cajas_reales').value) || 0;
        const decomisoKg = parseFloat(document.getElementById('decomiso_kg').value) || 0;
        const reprocesoKg = parseFloat(document.getElementById('reproceso_kg').value) || 0;
        const scrapKg = parseFloat(document.getElementById('scrap_flex_kg').value) || 0;
        const codigo = document.getElementById('codigo').value.trim();

        const teorico = listaTeoricosGlobal.find(t => String(t.codigo).trim() === String(codigo).trim());
        
        let kgTeorico = 0;
        if (teorico) {
            const peso = parseFloat(teorico.peso) || 0;
            const uxb = parseFloat(teorico.uxb) || 0;
            const bultosHora = parseFloat(teorico.bultos_hora) || 0;
            kgTeorico = uxb * peso * bultosHora * hsTrab;
        }

        const eficRealPct = kgTeorico > 0 ? ((kgReales / kgTeorico) * 100) : 0;
        const decomisoPct = kgReales > 0 ? ((decomisoKg / kgReales) * 100) : 0;
        const reprocesoPct = kgReales > 0 ? ((reprocesoKg / kgReales) * 100) : 0;
        const scrapPct = kgReales > 0 ? ((scrapKg / kgReales) * 100) : 0;

        const elEfic = document.getElementById('kpi_efic_real');
        const elDecomiso = document.getElementById('kpi_decomiso_pct');
        const elReproceso = document.getElementById('kpi_reproceso_pct');
        const elScrap = document.getElementById('kpi_scrap_pct');

        if (elEfic) elEfic.value = `${eficRealPct.toFixed(1)}%`;
        if (elDecomiso) elDecomiso.value = `${decomisoPct.toFixed(2)}%`;
        if (elReproceso) elReproceso.value = `${reprocesoPct.toFixed(2)}%`;
        if (elScrap) elScrap.value = `${scrapPct.toFixed(2)}%`;
    }

    function renderizarTabla() {
        const tbody = document.getElementById('tbody-planillas');
        if (!tbody) return;
        tbody.innerHTML = '';

        const filtrados = datosGlobales.filter(p => 
            String(p.planta).toLowerCase().trim() === plantaActual
        );

        filtrados.forEach(item => {
            const kpi = calcularKPIs(item);
            const tr = document.createElement('tr');
            
            tr.onclick = () => seleccionarFila(tr, item.id);
            if (idSeleccionado === item.id) tr.classList.add('fila-seleccionada');

            tr.innerHTML = `
                <td>${item.id}</td>
                <td>${item.fecha}</td>
                <td><strong>${item.planta}</strong></td>
                <td>${item.centro_trabajo}</td>
                <td>${item.codigo}</td>
                <td>${item.turno}</td>
                <td>${item.horas_trabajadas}</td>
                <td>${item.kg_cajas_reales}</td>
                <td>${kpi.kgTeorico}</td>
                <td><strong>${kpi.eficRealPct}%</strong></td>
                <td>${kpi.decomisoPct}%</td>
                <td>${kpi.reprocesoPct}%</td>
                <td>${kpi.scrapPct}%</td>
                <td>${kpi.incidenciaPct}%</td>
                <td>${item.dotacion_real || item.dotacion_teorica}</td>
                <td>
                    <button class="btn-edit" onclick="event.stopPropagation(); modificarPlanilla(${item.id})">Editar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function seleccionarFila(trElement, id) {
        document.querySelectorAll('#tbody-planillas tr').forEach(r => r.classList.remove('fila-seleccionada'));
        idSeleccionado = id;
        trElement.classList.add('fila-seleccionada');
    }

    function modificarSeleccionada() {
        if (!idSeleccionado) {
            alert("Por favor, seleccione una planilla de la tabla para modificar.");
            return;
        }
        modificarPlanilla(idSeleccionado);
    }

    function buscarDescripcionYTeoricoAuto() {
        const codInput = document.getElementById('codigo').value.trim();
        const inputDesc = document.getElementById('descripcion_producto');
        const inputDotacion = document.getElementById('dotacion_teorica');

        if (!codInput) {
            inputDesc.value = '';
            inputDotacion.value = 0;
            calcularKPIsEnTiempoReal();
            return;
        }

        const teoricoEncontrado = listaTeoricosGlobal.find(t => 
            String(t.codigo).toLowerCase().trim() === String(codInput).toLowerCase().trim()
        );

        if (teoricoEncontrado) {
            inputDesc.value = teoricoEncontrado.descripcion || 'Sin descripción';
            inputDotacion.value = teoricoEncontrado.dotacion || 0;
        } else {
            inputDesc.value = '⚠️ Código no encontrado';
            inputDotacion.value = 0;
        }

        calcularKPIsEnTiempoReal();
    }

    async function abrirFormulario() {
        document.getElementById('form-planilla').reset();
        document.getElementById('planilla-id').value = '';
        
        try {
            if (!listaSectoresGlobal || listaSectoresGlobal.length === 0) {
                await cargarBaseDatosAuxiliares();
            }
        } catch (err) {
            console.error("No se pudieron cargar los sectores al abrir:", err);
        }
        
        poblarComboSectores();
        calcularKPIsEnTiempoReal();
        
        document.getElementById('modal-titulo').innerText = `Nueva Planilla (${plantaActual.toUpperCase()})`;
        
        const modal = document.getElementById('modal-planilla');
        if (modal) {
            modal.style.display = 'flex';
        }
        
        const bodyScroll = document.querySelector('.modal-body-scroll');
        if (bodyScroll) bodyScroll.scrollTop = 0;
    }

    function modificarPlanilla(id) {
        const r = datosGlobales.find(p => p.id === id);
        if (!r) return;

        document.getElementById('planilla-id').value = r.id;
        document.getElementById('fecha').value = r.fecha;
        document.getElementById('turno').value = r.turno;
        
        poblarComboSectores();
        document.getElementById('centro_trabajo').value = r.centro_trabajo || '';
        
        document.getElementById('codigo').value = r.codigo;
        buscarDescripcionYTeoricoAuto();

        document.getElementById('horas_trabajadas').value = r.horas_trabajadas;
        document.getElementById('dotacion_teorica').value = r.dotacion_teorica;
        document.getElementById('dotacion_real').value = r.dotacion_real;

        document.getElementById('kg_cajas_reales').value = r.kg_cajas_reales;
        document.getElementById('peso_promedio_unid_kg').value = r.peso_promedio_unid_kg;
        document.getElementById('decomiso_kg').value = r.decomiso_kg;
        document.getElementById('reproceso_kg').value = r.reproceso_kg;
        document.getElementById('scrap_flex_kg').value = r.scrap_flex_kg;

        // Detenciones y Observaciones
        document.getElementById('detencion_produccion').value = r.detencion_produccion || 0;
        document.getElementById('detencion_refrigerio').value = r.detencion_refrigerio || 0;
        document.getElementById('detencion_mecanico').value = r.detencion_mecanico || 0;
        document.getElementById('detencion_electrico').value = r.detencion_electrico || 0;
        document.getElementById('detencion_calidad').value = r.detencion_calidad || 0;
        document.getElementById('detencion_programacion').value = r.detencion_programacion || 0;
        document.getElementById('detencion_limpieza').value = r.detencion_limpieza || 0;
        document.getElementById('detencion_abastecimiento').value = r.detencion_abastecimiento || 0;
        document.getElementById('detencion_desarrollo').value = r.detencion_desarrollo || 0;
        document.getElementById('detencion_alistamiento').value = r.detencion_alistamiento || 0;
        document.getElementById('detencion_rrhh').value = r.detencion_rrhh || 0;
        document.getElementById('detencion_suministro').value = r.detencion_suministro || 0;

        const elObsProd = document.getElementById('obs_detencion_produccion');
        if (elObsProd) elObsProd.value = r.obs_detencion_produccion || '';

        const elObsRef = document.getElementById('obs_detencion_refrigerio');
        if (elObsRef) elObsRef.value = r.obs_detencion_refrigerio || '';

        const elObsMec = document.getElementById('obs_detencion_mecanico');
        if (elObsMec) elObsMec.value = r.obs_detencion_mecanico || '';

        const elObsElec = document.getElementById('obs_detencion_electrico');
        if (elObsElec) elObsElec.value = r.obs_detencion_electrico || '';

        const elObsCal = document.getElementById('obs_detencion_calidad');
        if (elObsCal) elObsCal.value = r.obs_detencion_calidad || '';

        const elObsProg = document.getElementById('obs_detencion_programacion');
        if (elObsProg) elObsProg.value = r.obs_detencion_programacion || '';

        const elObsLimp = document.getElementById('obs_detencion_limpieza');
        if (elObsLimp) elObsLimp.value = r.obs_detencion_limpieza || '';

        const elObsAbast = document.getElementById('obs_detencion_abastecimiento');
        if (elObsAbast) elObsAbast.value = r.obs_detencion_abastecimiento || '';

        const elObsDes = document.getElementById('obs_detencion_desarrollo');
        if (elObsDes) elObsDes.value = r.obs_detencion_desarrollo || '';

        const elObsAlist = document.getElementById('obs_detencion_alistamiento');
        if (elObsAlist) elObsAlist.value = r.obs_detencion_alistamiento || '';

        const elObsRrhh = document.getElementById('obs_detencion_rrhh');
        if (elObsRrhh) elObsRrhh.value = r.obs_detencion_rrhh || '';

        const elObsSum = document.getElementById('obs_detencion_suministro');
        if (elObsSum) elObsSum.value = r.obs_detencion_suministro || '';

        calcularKPIsEnTiempoReal();

        document.getElementById('modal-titulo').innerText = `Modificar Planilla #${r.id} (${plantaActual.toUpperCase()})`;
        
        const modal = document.getElementById('modal-planilla');
        if (modal) {
            modal.style.display = 'flex';
        }
        
        const bodyScroll = document.querySelector('.modal-body-scroll');
        if (bodyScroll) bodyScroll.scrollTop = 0;
    }

    function cerrarFormulario() {
        document.getElementById('modal-planilla').style.display = 'none';
    }

    async function guardarPlanilla(e) {
        e.preventDefault();
        
        const idEdit = document.getElementById('planilla-id').value;
        const dotTeorica = parseFloat(document.getElementById('dotacion_teorica').value) || 0;
        const dotRealVal = document.getElementById('dotacion_real').value;

        const payload = {
            fecha: document.getElementById('fecha').value,
            planta: plantaActual,
            turno: document.getElementById('turno').value,
            centro_trabajo: document.getElementById('centro_trabajo').value,
            codigo: document.getElementById('codigo').value.trim(),
            horas_trabajadas: parseFloat(document.getElementById('horas_trabajadas').value) || 0,
            dotacion_teorica: dotTeorica,
            dotacion_real: dotRealVal !== "" ? parseFloat(dotRealVal) : dotTeorica,
            kg_cajas_reales: parseFloat(document.getElementById('kg_cajas_reales').value) || 0,
            peso_promedio_unid_kg: parseFloat(document.getElementById('peso_promedio_unid_kg').value) || 0,
            decomiso_kg: parseFloat(document.getElementById('decomiso_kg').value) || 0,
            reproceso_kg: parseFloat(document.getElementById('reproceso_kg').value) || 0,
            scrap_flex_kg: parseFloat(document.getElementById('scrap_flex_kg').value) || 0,
            
            detencion_produccion: parseFloat(document.getElementById('detencion_produccion').value) || 0,
            detencion_refrigerio: parseFloat(document.getElementById('detencion_refrigerio').value) || 0,
            detencion_mecanico: parseFloat(document.getElementById('detencion_mecanico').value) || 0,
            detencion_electrico: parseFloat(document.getElementById('detencion_electrico').value) || 0,
            detencion_calidad: parseFloat(document.getElementById('detencion_calidad').value) || 0,
            detencion_programacion: parseFloat(document.getElementById('detencion_programacion').value) || 0,
            detencion_limpieza: parseFloat(document.getElementById('detencion_limpieza').value) || 0,
            detencion_abastecimiento: parseFloat(document.getElementById('detencion_abastecimiento').value) || 0,
            detencion_desarrollo: parseFloat(document.getElementById('detencion_desarrollo').value) || 0,
            detencion_alistamiento: parseFloat(document.getElementById('detencion_alistamiento').value) || 0,
            detencion_rrhh: parseFloat(document.getElementById('detencion_rrhh').value) || 0,
            detencion_suministro: parseFloat(document.getElementById('detencion_suministro').value) || 0,

            obs_detencion_produccion: document.getElementById('obs_detencion_produccion')?.value || '',
            obs_detencion_refrigerio: document.getElementById('obs_detencion_refrigerio')?.value || '',
            obs_detencion_mecanico: document.getElementById('obs_detencion_mecanico')?.value || '',
            obs_detencion_electrico: document.getElementById('obs_detencion_electrico')?.value || '',
            obs_detencion_calidad: document.getElementById('obs_detencion_calidad')?.value || '',
            obs_detencion_programacion: document.getElementById('obs_detencion_programacion')?.value || '',
            obs_detencion_limpieza: document.getElementById('obs_detencion_limpieza')?.value || '',
            obs_detencion_abastecimiento: document.getElementById('obs_detencion_abastecimiento')?.value || '',
            obs_detencion_desarrollo: document.getElementById('obs_detencion_desarrollo')?.value || '',
            obs_detencion_alistamiento: document.getElementById('obs_detencion_alistamiento')?.value || '',
            obs_detencion_rrhh: document.getElementById('obs_detencion_rrhh')?.value || '',
            obs_detencion_suministro: document.getElementById('obs_detencion_suministro')?.value || ''
        };

        const esEdicion = Boolean(idEdit);
        const url = esEdicion ? `/api/planillas/${idEdit}` : '/api/planillas';
        const metodo = esEdicion ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                cerrarFormulario();
                cargarPlanillas();
            } else {
                alert(`Error al ${esEdicion ? 'actualizar' : 'registrar'} la planilla.`);
            }
        } catch (err) {
            console.error("Error al guardar planilla:", err);
            alert("Error de conexión al guardar.");
        }
    }

    function aplicarFiltros() {
        const textoBusqueda = document.getElementById('input-buscar').value.toLowerCase().trim();
        const fechaBusqueda = document.getElementById('filtro-fecha').value;

        const filas = document.querySelectorAll('#tbody-planillas tr');

        filas.forEach(fila => {
            const textoFila = fila.innerText.toLowerCase();
            const coincideTexto = !textoBusqueda || textoFila.includes(textoBusqueda);
            
            const celdaFecha = fila.children[1] ? fila.children[1].innerText : '';
            const coincideFecha = !fechaBusqueda || celdaFecha === fechaBusqueda;

            if (coincideTexto && coincideFecha) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    }
</script>
