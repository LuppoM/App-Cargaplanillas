<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Teóricos</title>
    <link rel="stylesheet" href="/static/teoricosvista.css">
</head>
<body>

    <div class="teoricos-screen">
        
        <!-- ENCABEZADO SUPERIOR -->
        <header class="top-header">
            <h1>GESTIÓN DE TEÓRICOS DE PRODUCCIÓN</h1>
            
            <div class="toolbar">
                <button class="btn-tool" onclick="abrirFormulario()">+ Nuevo Teórico</button>
                <button class="btn-tool" onclick="editarSeleccionado()">Modificar</button>
                <a href="/" class="btn-tool btn-cerrar-pantalla" style="text-decoration: none; display: inline-block;">Volver</a>
            </div>
            
            <div class="filtros-bar">
                <label for="input-buscar">Buscar General:</label>
                <input type="text" id="input-buscar" placeholder="Buscar en toda la tabla..." onkeyup="filtrarTablaGeneral()">
            </div>
        </header>

        <!-- TABLA A PANTALLA COMPLETA -->
        <main class="tabla-container">
            <table class="tabla-teoricos">
                <thead>
                    <!-- FILA DE FILTROS POR COLUMNA -->
                    <tr class="fila-filtros">
                        <th><input type="text" class="input-filtro-col" placeholder="id" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="planta" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="estado" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="codigo" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="descripcion" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="bultos_hora" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="dotacion" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="centro_trabajo" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="uxb" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="peso" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="kg_teoricos" onkeyup="filtrarColumnas()"></th>
                        <th><input type="text" class="input-filtro-col" placeholder="flex_unid_kg" onkeyup="filtrarColumnas()"></th>
                    </tr>
                    <!-- TITULOS DE COLUMNAS -->
                    <tr class="titulos-cabecera">
                        <th>id</th>
                        <th>planta</th>
                        <th>estado</th>
                        <th>codigo</th>
                        <th>descripcion</th>
                        <th>bultos_hora</th>
                        <th>dotacion</th>
                        <th>centro_trabajo</th>
                        <th>uxb</th>
                        <th>peso</th>
                        <th>kg_teoricos</th>
                        <th>flex_unid_kg</th>
                    </tr>
                </thead>
                <tbody id="tbody-teoricos">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- MODAL Y FORMULARIO -->
    <div id="modal-teorico" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Nuevo Teórico</h3>
                <span class="btn-cerrar" onclick="cerrarFormulario()">&times;</span>
            </div>
            
            <form id="form-teorico" onsubmit="guardarTeorico(event)">
                <input type="hidden" id="teorico-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="planta">Planta / Sector</label>
                        <select id="planta" name="planta" onchange="actualizarComboSectoresPorPlanta()">
                            <option value="chocolate">Chocolate</option>
                            <option value="golosinas">Golosinas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Estado</label>
                        <input type="text" id="estado" required>
                    </div>

                    <div class="form-group">
                        <label>Código</label>
                        <input type="text" id="codigo" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Descripción</label>
                        <input type="text" id="descripcion" required>
                    </div>

                    <div class="form-group">
                        <label>Bultos / Hora</label>
                        <input type="number" step="0.0001" id="bultos_hora">
                    </div>

                    <div class="form-group">
                        <label>Dotación</label>
                        <input type="number" step="0.5" id="dotacion">
                    </div>

                    <div class="form-group">
                        <label for="centro_trabajo">Centro de Trabajo</label>
                        <select id="centro_trabajo" name="centro_trabajo">
                            <option value="">Seleccione un sector...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>UXB</label>
                        <input type="number" step="0.01" id="uxb">
                    </div>

                    <div class="form-group">
                        <label>Peso</label>
                        <input type="number" step="0.0001" id="peso">
                    </div>

                    <div class="form-group">
                        <label>Kg Teóricos</label>
                        <input type="number" step="0.0001" id="kg_teoricos" readonly tabindex="-1" style="background-color: #e9ecef; cursor: not-allowed;">
                    </div>

                    <div class="form-group full-width">
                        <label>Flex Unid (kg)</label>
                        <input type="number" step="0.000001" id="flex_unid_kg">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancelar" onclick="cerrarFormulario()">Cancelar</button>
                    <button type="submit" class="btn-guardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>
<script>
    let objetoSeleccionado = null;
    let datosGlobales = [];
    let datosFiltrados = [];
    let listaSectoresGlobal = []; // Guarda todos los sectores traídos de la API
    let paginaActual = 1;
    const registrosPorPagina = 50;
    let temporizadorFiltro = null;

    document.addEventListener('DOMContentLoaded', () => {
        cargarTeoricos();
        cargarSectoresIniciales(); // Carga la lista global de sectores

        // Escucha el cambio de planta en el formulario para filtrar sectores
        const selectPlanta = document.getElementById('planta');
        if (selectPlanta) {
            selectPlanta.addEventListener('change', () => actualizarComboSectoresPorPlanta());
        }

        // Listeners para el cálculo automático de Kg Teóricos
        document.getElementById('bultos_hora').addEventListener('input', calcularKgTeoricos);
        document.getElementById('uxb').addEventListener('input', calcularKgTeoricos);
        document.getElementById('peso').addEventListener('input', calcularKgTeoricos);
    });

    function calcularKgTeoricos() {
        const bultosHora = parseFloat(document.getElementById('bultos_hora').value) || 0;
        const uxb = parseFloat(document.getElementById('uxb').value) || 0;
        const peso = parseFloat(document.getElementById('peso').value) || 0;
        const resultado = uxb * peso * bultosHora;
        document.getElementById('kg_teoricos').value = resultado ? resultado.toFixed(4) : 0;
    }

    // Trae todos los sectores de la API una sola vez
    async function cargarSectoresIniciales() {
        try {
            const res = await fetch('/api/sectores');
            const resJson = await res.json();
            listaSectoresGlobal = resJson.datos || [];
            actualizarComboSectoresPorPlanta();
        } catch (e) {
            console.error("Error al cargar la lista de sectores:", e);
        }
    }

    // Filtra los sectores según la planta elegida en el select del modal
    function actualizarComboSectoresPorPlanta(valorSeleccionado = '') {
        const selectPlanta = document.getElementById('planta');
        const plantaSeleccionada = selectPlanta ? selectPlanta.value.toLowerCase().trim() : 'chocolate';
        const selectCentro = document.getElementById('centro_trabajo');
        
        if (!selectCentro) return;

        selectCentro.innerHTML = '<option value="">Seleccione un sector...</option>';

        // Filtra los sectores que pertenecen a la planta activa
        const sectoresFiltrados = listaSectoresGlobal.filter(sec => 
            String(sec.planta).toLowerCase().trim() === plantaSeleccionada && (sec.activo || sec.nombre === valorSeleccionado)
        );

        sectoresFiltrados.forEach(sec => {
            const option = document.createElement('option');
            option.value = sec.nombre;
            option.textContent = sec.nombre;
            selectCentro.appendChild(option);
        });

        if (valorSeleccionado) {
            selectCentro.value = valorSeleccionado;
        }
    }

    async function cargarTeoricos() {
        try {
            const res = await fetch('/api/teoricos');
            const resJson = await res.json();
            datosGlobales = resJson.datos || [];
            datosFiltrados = [...datosGlobales];
            paginaActual = 1;
            renderizarTabla();
        } catch (e) {
            console.error("Error al cargar teóricos:", e);
        }
    }

    function renderizarTabla() {
        const tbody = document.getElementById('tbody-teoricos');
        tbody.innerHTML = '';
        objetoSeleccionado = null;

        const inicio = (paginaActual - 1) * registrosPorPagina;
        const fin = inicio + registrosPorPagina;
        const paginaDatos = datosFiltrados.slice(inicio, fin);

        paginaDatos.forEach(item => {
            const tr = document.createElement('tr');
            tr.onclick = function() {
                document.querySelectorAll('#tbody-teoricos tr').forEach(r => r.classList.remove('fila-seleccionada'));
                tr.classList.add('fila-seleccionada');
                objetoSeleccionado = item;
            };

            tr.innerHTML = `
                <td>${item.id ?? ''}</td>
                <td>${item.planta ?? ''}</td>
                <td>${item.estado ?? ''}</td>
                <td><strong>${item.codigo ?? ''}</strong></td>
                <td>${item.descripcion ?? ''}</td>
                <td>${item.bultos_hora ?? 0}</td>
                <td>${item.dotacion ?? 0}</td>
                <td>${item.centro_trabajo ?? ''}</td>
                <td>${item.uxb ?? 0}</td>
                <td>${item.peso ?? 0}</td>
                <td>${item.kg_teoricos ?? 0}</td>
                <td>${item.flex_unid_kg ?? 0}</td>
            `;
            tbody.appendChild(tr);
        });

        actualizarControlesPaginacion();
    }

    function actualizarControlesPaginacion() {
        let contenedor = document.getElementById('paginacion-container');
        if (!contenedor) {
            contenedor = document.createElement('div');
            contenedor.id = 'paginacion-container';
            contenedor.style.cssText = 'padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; font-size: 13px; font-weight: bold;';
            document.querySelector('.tabla-container').after(contenedor);
        }

        const totalPaginas = Math.ceil(datosFiltrados.length / registrosPorPagina) || 1;
        contenedor.innerHTML = `
            <span>Mostrando ${datosFiltrados.length} registros (Página ${paginaActual} de ${totalPaginas})</span>
            <button class="btn-tool" ${paginaActual === 1 ? 'disabled' : ''} onclick="cambiarPagina(-1)">Anterior</button>
            <button class="btn-tool" ${paginaActual >= totalPaginas ? 'disabled' : ''} onclick="cambiarPagina(1)">Siguiente</button>
        `;
    }

    function cambiarPagina(delta) {
        paginaActual += delta;
        renderizarTabla();
    }

    function aplicarFiltros() {
        clearTimeout(temporizadorFiltro);
        temporizadorFiltro = setTimeout(() => {
            const buscarGeneral = document.getElementById('input-buscar').value.toLowerCase().trim();
            const inputsCols = Array.from(document.querySelectorAll('.input-filtro-col'));
            
            const filtrosCols = inputsCols.map((input, idx) => ({
                idx,
                val: input.value.toLowerCase().trim()
            })).filter(f => f.val !== '');

            const llaves = ['id', 'planta', 'estado', 'codigo', 'descripcion', 'bultos_hora', 'dotacion', 'centro_trabajo', 'uxb', 'peso', 'kg_teoricos', 'flex_unid_kg'];

            datosFiltrados = datosGlobales.filter(item => {
                // Filtro general
                if (buscarGeneral) {
                    const textoFila = Object.values(item).join(' ').toLowerCase();
                    if (!textoFila.includes(buscarGeneral)) return false;
                }

                // Filtros por columna
                for (let f of filtrosCols) {
                    const clave = llaves[f.idx];
                    const valorCelda = String(item[clave] ?? '').toLowerCase();
                    if (!valorCelda.includes(f.val)) return false;
                }

                return true;
            });

            paginaActual = 1;
            renderizarTabla();
        }, 200);
    }

    function filtrarTablaGeneral() { aplicarFiltros(); }
    function filtrarColumnas() { aplicarFiltros(); }

    function abrirFormulario() {
        document.getElementById('form-teorico').reset();
        document.getElementById('teorico-id').value = '';
        document.getElementById('kg_teoricos').value = '';
        document.getElementById('planta').value = 'chocolate';
        actualizarComboSectoresPorPlanta(); // Reinicia los sectores para 'chocolate'
        document.getElementById('modal-titulo').innerText = 'Nuevo Teórico';
        document.getElementById('modal-teorico').style.display = 'flex';
    }

    function cerrarFormulario() {
        document.getElementById('modal-teorico').style.display = 'none';
    }

    function editarSeleccionado() {
        if (!objetoSeleccionado) {
            alert("Seleccioná una fila de la tabla haciéndole clic para modificarla.");
            return;
        }
        editarTeorico(objetoSeleccionado);
    }

    function editarTeorico(item) {
        document.getElementById('teorico-id').value = item.id;
        
        const plantaValor = (item.planta || 'chocolate').toLowerCase();
        document.getElementById('planta').value = plantaValor;
        
        document.getElementById('estado').value = item.estado || '';
        document.getElementById('codigo').value = item.codigo || '';
        document.getElementById('descripcion').value = item.descripcion || '';
        document.getElementById('bultos_hora').value = item.bultos_hora || 0;
        document.getElementById('dotacion').value = item.dotacion || 0;

        // Actualiza las opciones del combo según la planta del registro y selecciona su sector
        actualizarComboSectoresPorPlanta(item.centro_trabajo || '');

        document.getElementById('uxb').value = item.uxb || 0;
        document.getElementById('peso').value = item.peso || 0;
        document.getElementById('flex_unid_kg').value = item.flex_unid_kg || 0;

        calcularKgTeoricos();

        document.getElementById('modal-titulo').innerText = 'Editar Teórico';
        document.getElementById('modal-teorico').style.display = 'flex';
    }

    async function guardarTeorico(e) {
        e.preventDefault();
        calcularKgTeoricos();

        const id = document.getElementById('teorico-id').value;
        const payload = {
            planta: document.getElementById('planta').value,
            estado: document.getElementById('estado').value,
            codigo: document.getElementById('codigo').value,
            descripcion: document.getElementById('descripcion').value,
            bultos_hora: parseFloat(document.getElementById('bultos_hora').value) || 0,
            dotacion: parseFloat(document.getElementById('dotacion').value) || 0,
            centro_trabajo: document.getElementById('centro_trabajo').value,
            uxb: parseFloat(document.getElementById('uxb').value) || 0,
            peso: parseFloat(document.getElementById('peso').value) || 0,
            kg_teoricos: parseFloat(document.getElementById('kg_teoricos').value) || 0,
            flex_unid_kg: parseFloat(document.getElementById('flex_unid_kg').value) || 0
        };

        const url = id ? `/api/teoricos/${id}` : '/api/teoricos';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            cerrarFormulario();
            cargarTeoricos();
        } else {
            alert("Error al guardar registro.");
        }
    }
</script>
  

</body>
</html>
