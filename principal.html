<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Producción - Dashboard</title>
    <link rel="stylesheet" href="/static/principalvista.css">
</head>
<body>

    <!-- BARRA SUPERIOR BORGOÑA -->
    <header class="top-bar">
        <nav class="nav-container">
            
            <!-- Botón redirige a la pantalla independiente -->
            <button class="nav-btn" onclick="window.location.href='/teoricos.html'">
                TEÓRICOS
            </button>

            <!-- Botón Carga Planillas -->
            <button class="nav-btn">
                CARGA PLANILLAS
            </button>

            <!-- Desplegable Parámetros -->
            <div class="dropdown">
                <button class="nav-btn">
                    PARÁMETROS ▼
                </button>
                <div class="dropdown-menu">
                    <a href="#">Sectores</a>
                </div>
            </div>

            <!-- Botón Salir -->
            <button class="nav-btn btn-salir" onclick="cerrarSesion()">
                SALIR
            </button>

        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="content-container">
        <div class="welcome-card">
            <h2>Sistema de Gestión de Producción</h2>
            <p>Seleccione una opción del menú superior para comenzar.</p>
        </div>
    </main>

    <script>
        function cerrarSesion() {
            if (confirm("¿Desea cerrar la sesión?")) {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
