<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE PRODUCCIÓN - CARGA DE PLANILLAS</title>

    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/static/principalvista.css">
    

    <style>
        .top-bar {
            position: relative;
        }
        .usuario-badge {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            background: rgba(0, 0, 0, 0.22);
            padding: 6px 12px;
            border-radius: 6px;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>

    <script>
        // Bloquea acceso si no hay sesión iniciada
        const sesionRaw = sessionStorage.getItem('usuario_sesion');
        if (!sesionRaw) {
            window.location.replace('/login');
        }
        const usuarioActual = sesionRaw ? JSON.parse(sesionRaw) : null;
    </script>
</head>
<body>

    <div class="top-bar">
        <div class="nav-container">

            <a href="/Teoricos" class="nav-btn" data-modulo="teoricos">TEÓRICOS</a>
            <a href="/ntanque" class="nav-btn" data-modulo="tanques">NIVELES DE TANQUE</a>

            <button class="nav-btn" data-modulo="planillas" onclick="window.location.href='/planillas'">
                CARGA PLANILLAS
            </button>
            <button class="nav-btn" data-modulo="planillas" onclick="window.location.href='/CONTROLDECOMISO'">
                CONTROL DECOMISO
            </button>

            <div class="dropdown" data-modulo="parametros">
                <button class="nav-btn" onclick="toggleDropdown(event, 'menuParametros')">
                    PARÁMETROS ▼
                </button>
                <div id="menuParametros" class="dropdown-menu">
                    <a href="/sectores">SECTORES</a>
                    <a href="/abmusuarios">USUARIOS</a>
                </div>
            </div>

            <button type="button" onclick="cerrarSesion()" class="nav-btn btn-salir">SALIR</button>

        </div>

        <span id="info-usuario" class="usuario-badge"></span>
    </div>

    <!-- CONTENEDOR PRINCIPAL / DASHBOARD -->
    <main class="content-container">
        <div class="welcome-card">
            <h2>Sistema de Gestión de Producción</h2>
            <p id="bienvenida-texto">Seleccione una opción del menú superior para comenzar.</p>
        </div>
    </main>

    <script>
        function aplicarVisibilidadMenu(datosUser) {
            const spanUser = document.getElementById('info-usuario');
            if (spanUser) {
                spanUser.textContent = `Usuario: ${datosUser.usuario}`;
            }

            const bienvenida = document.getElementById('bienvenida-texto');
            if (bienvenida) {
                bienvenida.textContent = `Bienvenido, ${datosUser.usuario}. Seleccione una opción del menú superior para comenzar.`;
            }

            // Lee los módulos habilitados (ej: "teoricos,planillas" o "*")
            const modsUsuario = (datosUser.modulos || '')
                .split(',')
                .map(m => m.trim().toLowerCase())
                .filter(Boolean);

            const accesoTotal = modsUsuario.includes('*') || (datosUser.rol || '').toLowerCase() === 'admin';

            // Muestra u oculta cada botón según data-modulo
            document.querySelectorAll('[data-modulo]').forEach(el => {
                const req = (el.dataset.modulo || '').trim().toLowerCase();
                if (!accesoTotal && !modsUsuario.includes(req)) {
                    el.style.display = 'none';
                } else {
                    el.style.display = '';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!usuarioActual) return;

            // 1. Aplica inmediatamente lo que ya tiene en sesión
            aplicarVisibilidadMenu(usuarioActual);

            // 2. Sincroniza con la BD para que los cambios del ABM apliquen al instante al recargar
            try {
                const resp = await fetch('/api/usuarios', {
                    headers: { 'X-Usuario': usuarioActual.usuario }
                });
                if (resp.ok) {
                    const lista = await resp.json();
                    const actualizado = lista.find(
                        u => u.id === usuarioActual.id || u.usuario.toLowerCase() === usuarioActual.usuario.toLowerCase()
                    );
                    if (actualizado) {
                        const nuevaSesion = {
                            ...usuarioActual,
                            rol: actualizado.rol,
                            puede_leer: actualizado.puede_leer,
                            puede_crear: actualizado.puede_crear,
                            puede_editar: actualizado.puede_editar,
                            puede_eliminar: actualizado.puede_eliminar,
                            modulos: actualizado.modulos || ''
                        };
                        sessionStorage.setItem('usuario_sesion', JSON.stringify(nuevaSesion));
                        aplicarVisibilidadMenu(nuevaSesion);
                    }
                }
            } catch (e) {
                console.warn('No se pudo refrescar sesión desde API:', e);
            }
        });

        function cerrarSesion() {
            sessionStorage.removeItem('usuario_sesion');
            window.location.replace('/login');
        }

        // Función para abrir / cerrar desplegables
        function toggleDropdown(event, menuId) {
            event.stopPropagation();
            
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) {
                    menu.classList.remove('show');
                }
            });

            const menu = document.getElementById(menuId);
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        // Cerrar menú al hacer click afuera
        window.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });
    </script>
</body>
</html>
