<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Producción - Dashboard</title>
    <!-- Asegúrate de incluir /static/ para que cargue los estilos -->
    <link rel="stylesheet" href="/static/principalvista.css">
</head>
<body>

    <!-- BARRA SUPERIOR BORGOÑA -->
    <header class="top-bar">
        <nav class="nav-container">
            
            <!-- Botón Teóricos -->
            <button class="nav-btn" onclick="abrirSeccion('teoricos')">
                TEÓRICOS
            </button>

            <!-- Desplegable Carga Planillas -->
            <div class="button">
                <button class="nav-btn">
                    CARGA PLANILLAS
                </button>
            </div>

            <!-- Desplegable Parámetros (Contiene Sectores) -->
            <div class="dropdown">
                <button class="nav-btn">
                    PARÁMETROS ▼
                </button>
                <div class="dropdown-menu">
                    <a href="#" onclick="abrirParametros('sectores')">Sectores</a>
                </div>
            </div>

            <!-- Botón Salir -->
            <button class="nav-btn btn-salir" onclick="cerrarSesion()">
                SALIR
            </button>

        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-content" class="content-container">
        <div class="welcome-card">
            <h2>Sistema de Gestión de Producción</h2>
            <p>Seleccione una opción del menú superior para comenzar.</p>
        </div>
    </main>

    <script src="/static/principalmodelo.py"></script>
</body>
</html>
