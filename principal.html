<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE PRODUCCIÓN - CARGA DE PLANILLAS</title>

    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/static/principalvista.css">

    <style>
        .top-bar {
            position: relative;
        }
        .usuario-badge {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            background: rgba(0, 0, 0, 0.22);
            padding: 6px 12px;
            border-radius: 6px;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>

    <script>
        // Bloquea acceso si no hay sesión iniciada
        const sesionRaw = sessionStorage.getItem('usuario_sesion');
        if (!sesionRaw) {
            window.location.replace('/login');
        }
        const usuarioActual = sesionRaw ? JSON.parse(sesionRaw) : null;
    </script>
</head>
<body>

    <div class="top-bar">
        <div class="nav-container">

            <a href="/Teoricos" class="nav-btn" data-roles="admin">TEÓRICOS</a>
            <a href="/ntanque" class="nav-btn" data-roles="admin,chocolate">NIVELES DE TANQUE</a>

            <button class="nav-btn" data-roles="admin,chocolate,golosinas" onclick="window.location.href='/planillas'">
                CARGA PLANILLAS
            </button>

            <div class="dropdown" data-roles="admin">
                <button class="nav-btn" onclick="toggleDropdown(event, 'menuParametros')">
                    PARÁMETROS ▼
                </button>
                <div id="menuParametros" class="dropdown-menu">
                    <a href="/sectores">Sectores</a>
                    <a href="/abmusuarios">Usuarios</a>
                </div>
            </div>

            <button type="button" onclick="cerrarSesion()" class="nav-btn btn-salir">SALIR</button>

        </div>

        <span id="info-usuario" class="usuario-badge"></span>
    </div>

    <!-- CONTENEDOR PRINCIPAL / DASHBOARD -->
    <main class="content-container">
        <div class="welcome-card">
            <h2>Sistema de Gestión de Producción</h2>
            <p id="bienvenida-texto">Seleccione una opción del menú superior para comenzar.</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!usuarioActual) return;

            const rol = (usuarioActual.rol || '').toLowerCase();

            // Muestra usuario como etiqueta arriba a la derecha (sin rol entre los botones)
            const spanUser = document.getElementById('info-usuario');
            if (spanUser) {
                spanUser.textContent = `Usuario: ${usuarioActual.usuario}`;
            }

            const bienvenida = document.getElementById('bienvenida-texto');
            if (bienvenida) {
                bienvenida.textContent = `Bienvenido, ${usuarioActual.usuario}. Seleccione una opción del menú superior para comenzar.`;
            }

            // Oculta botones según el rol del usuario
            document.querySelectorAll('[data-roles]').forEach(el => {
                const permitidos = el.dataset.roles.split(',').map(r => r.trim().toLowerCase());
                if (!permitidos.includes(rol)) {
                    el.style.display = 'none';
                }
            });
        });

        function cerrarSesion() {
            sessionStorage.removeItem('usuario_sesion');
            window.location.replace('/login');
        }

        // Función para abrir / cerrar desplegables
        function toggleDropdown(event, menuId) {
            event.stopPropagation();
            
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) {
                    menu.classList.remove('show');
                }
            });

            const menu = document.getElementById(menuId);
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        // Cerrar menú al hacer click afuera
        window.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });
    </script>
</body>
</html>
