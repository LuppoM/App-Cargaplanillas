<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Producción - Dashboard</title>
    <!-- Hojas de estilo estáticas -->
    <link rel="stylesheet" href="/static/principalvista.css">
    <link rel="stylesheet" href="/static/teoricosvista.css">
</head>
<body>

    <!-- BARRA SUPERIOR BORGOÑA -->
    <header class="top-bar">
        <nav class="nav-container">
            
            <!-- Botón Teóricos -->
            <button class="nav-btn" onclick="abrirSeccion('teoricos')">
                TEÓRICOS
            </button>

            <!-- Botón Carga Planillas -->
            <button class="nav-btn" onclick="abrirSeccion('planillas')">
                CARGA PLANILLAS
            </button>

            <!-- Desplegable Parámetros -->
            <div class="dropdown">
                <button class="nav-btn">
                    PARÁMETROS ▼
                </button>
                <div class="dropdown-menu">
                    <a href="#" onclick="abrirParametros('sectores')">Sectores</a>
                </div>
            </div>

            <!-- Botón Salir -->
            <button class="nav-btn btn-salir" onclick="cerrarSesion()">
                SALIR
            </button>

        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-content" class="content-container">
        <div class="welcome-card">
            <h2>Sistema de Gestión de Producción</h2>
            <p>Seleccione una opción del menú superior para comenzar.</p>
        </div>
    </main>

    <!-- SCRIPT DE NAVEGACIÓN EMBEBIDO EN EL HTML -->
    <script>
        async function abrirSeccion(seccion) {
            const contenedor = document.getElementById('app-content');

            if (seccion === 'teoricos') {
                try {
                    // 1. Obtener la plantilla HTML del módulo de Teóricos desde el backend
                    const respuestaHtml = await fetch('/teoricos.html');
                    if (!respuestaHtml.ok) throw new Error("No se pudo obtener la vista de teóricos");
                    
                    const html = await respuestaHtml.text();
                    contenedor.innerHTML = html;

                    // 2. Ejecutar o vincular el script dinámico para cargar los datos de la tabla
                    if (typeof cargarTeoricos === 'function') {
                        cargarTeoricos();
                    } else {
                        const script = document.createElement('script');
                        script.src = '/static/teoricos.js';
                        script.onload = () => {
                            if (typeof cargarTeoricos === 'function') cargarTeoricos();
                        };
                        document.body.appendChild(script);
                    }

                } catch (error) {
                    console.error("Error al cargar la sección de teóricos:", error);
                    contenedor.innerHTML = `<div class="welcome-card"><h2>Error</h2><p>No se pudo cargar el módulo de Teóricos.</p></div>`;
                }
            }
        }

        function abrirParametros(param) {
            console.log(`Parámetro seleccionado: ${param}`);
        }

        function cerrarSesion() {
            if (confirm("¿Desea cerrar la sesión?")) {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
